version: '3.8'
services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: ce_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5433:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [covid_net]

  airflow-init:
    build: { context: ., dockerfile: docker/Dockerfile.airflow }
    image: ce_airflow:latest
    container_name: ce_airflow_init
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./extract:/opt/airflow/extract
      - ./transform:/opt/airflow/transform
      - ./ml:/opt/airflow/ml
      - ./scripts:/opt/airflow/scripts
    entrypoint: /bin/bash
    command: ["-c", "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@covid.com || true"]
    restart: on-failure
    networks: [covid_net]

  airflow-webserver:
    build: { context: ., dockerfile: docker/Dockerfile.airflow }
    image: ce_airflow:latest
    container_name: ce_airflow_webserver
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./extract:/opt/airflow/extract
      - ./transform:/opt/airflow/transform
      - ./ml:/opt/airflow/ml
      - ./scripts:/opt/airflow/scripts
    ports: ["9090:8080"]
    command: webserver
    restart: always
    networks: [covid_net]

  airflow-scheduler:
    build: { context: ., dockerfile: docker/Dockerfile.airflow }
    image: ce_airflow:latest
    container_name: ce_airflow_scheduler
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./extract:/opt/airflow/extract
      - ./transform:/opt/airflow/transform
      - ./ml:/opt/airflow/ml
      - ./scripts:/opt/airflow/scripts
    command: scheduler
    restart: always
    networks: [covid_net]

  dashboard:
    build: { context: ., dockerfile: docker/Dockerfile.dashboard }
    container_name: ce_dashboard
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - ./dashboard:/app/dashboard
      - ./ml:/app/ml
      - ./api:/app/api
    ports: ["8511:8501"]
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    restart: always
    networks: [covid_net]

  api:
    build: { context: ., dockerfile: docker/Dockerfile.api }
    container_name: ce_api
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - ./api:/app/api
      - ./ml:/app/ml
    ports: ["8011:8000"]
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    restart: always
    networks: [covid_net]

volumes:
  postgres_data:
networks:
  covid_net:
    driver: bridge
